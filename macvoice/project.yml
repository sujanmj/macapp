name: MacVoice
options:
  bundleIdPrefix: com.sujanmj
  deploymentTarget:
    macOS: '14.0'
targets:
  MacVoice:
    type: application
    platform: macOS
    sources:
      - Sources/MacVoice
      - ../shared/UtilityKit
      - Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sujanmj.macvoice
        MARKETING_VERSION: '0.2.0'
        CURRENT_PROJECT_VERSION: '2'
        SWIFT_VERSION: '5.9'
        MACOSX_DEPLOYMENT_TARGET: '14.0'
        INFOPLIST_FILE: Sources/MacVoice/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Sources/MacVoice/MacVoice.entitlements
        ENABLE_APP_SANDBOX: NO
