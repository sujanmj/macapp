name: MacNotch
options:
  bundleIdPrefix: com.sujanmj
  deploymentTarget:
    macOS: '14.0'
targets:
  MacNotch:
    type: application
    platform: macOS
    sources:
      - Sources/MacNotch
      - ../shared/UtilityKit
      - Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sujanmj.macnotch
        MARKETING_VERSION: '0.18.0'
        CURRENT_PROJECT_VERSION: '18'
        SWIFT_VERSION: '5.9'
        MACOSX_DEPLOYMENT_TARGET: '14.0'
        INFOPLIST_FILE: Sources/MacNotch/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Sources/MacNotch/MacNotch.entitlements
        ENABLE_APP_SANDBOX: NO
