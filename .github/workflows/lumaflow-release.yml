name: Publish LumaFlow DMG

on:
  workflow_run:
    workflows: ["Build macOS apps"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  release:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download previously verified LumaFlow DMG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          RUN_ID="${{ github.event.workflow_run.id }}"
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh run list --repo sujanmj/macapp --workflow build.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          gh run download "$RUN_ID" --repo sujanmj/macapp --name lumaflow-dmg --dir dist
          test -s dist/LumaFlow-v0.3.dmg
          sha256sum dist/LumaFlow-v0.3.dmg
      - name: Publish downloadable LumaFlow v0.3 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view lumaflow-v0.3 --repo sujanmj/macapp >/dev/null 2>&1; then
            gh release upload lumaflow-v0.3 dist/LumaFlow-v0.3.dmg --clobber --repo sujanmj/macapp
          else
            gh release create lumaflow-v0.3 dist/LumaFlow-v0.3.dmg \
              --repo sujanmj/macapp \
              --target "${GITHUB_SHA}" \
              --title "LumaFlow v0.3" \
              --notes "Adds Check for Updates via GitHub Releases: SHA-256-verified DMG download and open. LumaFlow remains an experimental brightness app using a private macOS brightness API. Unsigned/not notarized."
          fi
