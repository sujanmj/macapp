name: Publish LumaFlow DMG
on:
  workflow_run:
    workflows: ["Build macOS apps"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  release:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve successful LumaFlow v0.8 build
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh run list --repo sujanmj/macapp --workflow build.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          gh run download "$RUN_ID" --repo sujanmj/macapp --name lumaflow-dmg --dir dist
          test -s dist/LumaFlow-v0.8.dmg
          test -s dist/LumaFlow-v0.8.dmg.sha256
          (cd dist && shasum -a 256 -c LumaFlow-v0.8.dmg.sha256)
      - name: Publish LumaFlow 0.8 and SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view lumaflow-v0.8 --repo sujanmj/macapp >/dev/null 2>&1; then
            gh release upload lumaflow-v0.8 dist/LumaFlow-v0.8.dmg dist/LumaFlow-v0.8.dmg.sha256 --clobber --repo sujanmj/macapp
          else
            gh release create lumaflow-v0.8 dist/LumaFlow-v0.8.dmg dist/LumaFlow-v0.8.dmg.sha256 \
              --repo sujanmj/macapp --target "${GITHUB_SHA}" \
              --title "LumaFlow v0.8 — signed bundle integrity" \
              --notes "LumaFlow v0.8 removes the redundant Open Login Items Settings menu row while preserving the functional Auto Brightness controls and screen-capture diagnostics. Ad-hoc signed; Screen Recording permission may need approval after update."
          fi
