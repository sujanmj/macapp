name: Publish MacPulse DMG
on:
  workflow_run:
    workflows: ["Build MacPulse"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve verified MacPulse v1.1 build
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh run list --repo sujanmj/macapp --workflow macpulse-build.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          BUILD_SHA=$(gh run view "$RUN_ID" --repo sujanmj/macapp --json headSha,headBranch,conclusion --jq 'select(.headBranch == "main" and .conclusion == "success") | .headSha')
          test -n "$BUILD_SHA"
          echo "sha=$BUILD_SHA" >> "$GITHUB_OUTPUT"
          gh run download "$RUN_ID" --repo sujanmj/macapp --name macpulse-dmg --dir dist
          test -s dist/MacPulse-v1.1.dmg
          test -s dist/MacPulse-v1.1.dmg.sha256
          (cd dist && sha256sum -c MacPulse-v1.1.dmg.sha256)
      - name: Publish verified DMG and SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ steps.build.outputs.sha }}
        run: |
          set -euo pipefail
          if gh release view macpulse-v1.1 --repo sujanmj/macapp >/dev/null 2>&1; then
            gh release upload macpulse-v1.1 dist/MacPulse-v1.1.dmg dist/MacPulse-v1.1.dmg.sha256 --clobber --repo sujanmj/macapp
          else
            gh release create macpulse-v1.1 dist/MacPulse-v1.1.dmg dist/MacPulse-v1.1.dmg.sha256 \
              --repo sujanmj/macapp --target "${BUILD_SHA}" \
              --title "MacPulse v1.1 — Startup Manager & Compact System Widget" \
              --notes "Adds confirmed removal of legacy login items, read-only third-party launch definitions and System Settings fallback for modern background items. High-RAM app quit remains confirmed and graceful. Medium widget shows timestamped RAM, CPU, hardware network rates, disk free and top regular-app RSS. Keep MacPulse running for snapshots; WidgetKit controls refresh timing. Read-only scoped file entitlement is retained during signing. Apple Silicon, macOS 14+. Ad-hoc signed, not notarized; device-level gallery and Automation checks remain necessary."
          fi
