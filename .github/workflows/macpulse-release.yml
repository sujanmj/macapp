name: Publish MacPulse DMG
on:
  workflow_run:
    workflows: ["Build macOS apps"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve verified MacPulse v0.3 build
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh run list --repo sujanmj/macapp --workflow build.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          gh run download "$RUN_ID" --repo sujanmj/macapp --name macpulse-dmg --dir dist
          test -s dist/MacPulse-v0.3.dmg
          test -s dist/MacPulse-v0.3.dmg.sha256
          (cd dist && sha256sum -c MacPulse-v0.3.dmg.sha256)
      - name: Publish verified DMG and SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view macpulse-v0.3 --repo sujanmj/macapp >/dev/null 2>&1; then
            gh release upload macpulse-v0.3 dist/MacPulse-v0.3.dmg dist/MacPulse-v0.3.dmg.sha256 --clobber --repo sujanmj/macapp
          else
            gh release create macpulse-v0.3 dist/MacPulse-v0.3.dmg dist/MacPulse-v0.3.dmg.sha256 \
              --repo sujanmj/macapp --target "${GITHUB_SHA}" \
              --title "MacPulse v0.3 — Free Mac Utility + Memory Widget" \
              --notes "Adds read-only folder-scoped Storage Analyzer with categorized disk usage, largest-file explorer and safety-checked, user-selected Move to Trash action. Retains memory widget, duplicate scanner and optional external WARP controls. Not notarized; macOS approval may be required."
          fi
