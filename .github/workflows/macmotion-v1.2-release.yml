name: Publish MacMotion v1.2

on:
  workflow_run:
    workflows: ["Build macOS apps"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Get MacMotion v1.2 DMG from successful macOS build
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          mkdir -p dist
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh run list --repo sujanmj/macapp --workflow build.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          test -n "$RUN_ID"
          gh run download "$RUN_ID" --repo sujanmj/macapp --name macmotion-dmg --dir dist
          test -s dist/MacMotion-v1.2.dmg
          sha256sum dist/MacMotion-v1.2.dmg

      - name: Publish MacMotion v1.2 release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view macmotion-v1.2 --repo sujanmj/macapp >/dev/null 2>&1; then
            gh release upload macmotion-v1.2 dist/MacMotion-v1.2.dmg --clobber --repo sujanmj/macapp
          else
            gh release create macmotion-v1.2 dist/MacMotion-v1.2.dmg \
              --repo sujanmj/macapp \
              --target "${GITHUB_SHA}" \
              --title "MacMotion v1.2 — Screen Saver" \
              --notes "Adds an installable MacMotion.saver plug-in and menu-bar installation action. Open System Settings → Wallpaper → Screen Saver… → Custom to select it. Wallpaper-gallery integration and animated lock screen are not included. Unsigned/unnotarized developer build."
          fi
