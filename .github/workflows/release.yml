name: Publish MacMotion DMG
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: bash macmotion/scripts/package-dmg.sh
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.1 >/dev/null 2>&1; then
            gh release upload v1.1 macmotion/MacMotion-v1.1.dmg --clobber
          else
            gh release create v1.1 macmotion/MacMotion-v1.1.dmg --target "$GITHUB_SHA" --title "MacMotion v1.1" --notes "Unsigned and unnotarized developer build."
          fi
