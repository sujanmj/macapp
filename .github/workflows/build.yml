name: Build macOS apps
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'macmotion/**'
      - 'lumaflow/**'
      - '.github/workflows/build.yml'
jobs:
  build:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: macmotion
            dmg: MacMotion-v1.1.dmg
          - app: lumaflow
            dmg: LumaFlow-v0.1.dmg
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Build and package
        run: bash ${{ matrix.app }}/scripts/package-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-dmg
          path: ${{ matrix.app }}/${{ matrix.dmg }}
