name: Build macOS apps
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'macmotion/**'
      - 'lumaflow/**'
      - '.github/workflows/build.yml'
concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: macmotion
            dmg: MacMotion-v1.8.dmg
          - app: lumaflow
            dmg: LumaFlow-v0.8.dmg
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen librsvg
      - name: Build and package
        run: bash ${{ matrix.app }}/scripts/package-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-dmg
          path: |
            ${{ matrix.app }}/${{ matrix.dmg }}
            ${{ matrix.app }}/${{ matrix.dmg }}.sha256
