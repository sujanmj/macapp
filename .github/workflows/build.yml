name: Build MacMotion
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Package DMG
        run: bash scripts/package-dmg.sh
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: MacMotion-dmg
          path: MacMotion-v1.1.dmg
      - name: Publish GitHub Release for tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" MacMotion-v1.1.dmg --title "MacMotion ${GITHUB_REF_NAME}" --notes "Unsigned macOS live wallpaper application. Not notarized."
