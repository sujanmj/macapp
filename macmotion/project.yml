name: MacMotion
options:
  bundleIdPrefix: com.macmotion
  deploymentTarget:
    macOS: '14.0'
targets:
  MacMotion:
    type: application
    platform: macOS
    sources:
      - Sources/MacMotion
      - Assets.xcassets
    preBuildScripts:
      - name: Generate MacMotion App Icon
        script: bash "$SRCROOT/scripts/generate-icons.sh"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.macmotion.wallpaper
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: '1.5.0'
        CURRENT_PROJECT_VERSION: '5'
        SWIFT_VERSION: '5.9'
        MACOSX_DEPLOYMENT_TARGET: '14.0'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        CODE_SIGN_STYLE: Automatic
        ENABLE_APP_SANDBOX: NO
        INFOPLIST_KEY_NSHighResolutionCapable: YES
