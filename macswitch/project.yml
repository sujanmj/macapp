name: MacSwitch
options:
  bundleIdPrefix: com.sujanmj
  deploymentTarget:
    macOS: '14.0'
targets:
  MacSwitch:
    type: application
    platform: macOS
    sources:
      - Sources/MacSwitch
      - ../shared/UtilityKit
      - Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sujanmj.macswitch
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
        SWIFT_VERSION: '5.9'
        MACOSX_DEPLOYMENT_TARGET: '14.0'
        INFOPLIST_FILE: Sources/MacSwitch/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Sources/MacSwitch/MacSwitch.entitlements
        ENABLE_APP_SANDBOX: NO
